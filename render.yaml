# Render Blueprint — one-click deploy for the LetsHunt push server
# Deploy this at: https://render.com
#
# This creates one service: a free web service running push-server.js.
#
# IMPORTANT — closed-app background push on the free tier:
# Render's free web service sleeps after ~15 minutes of zero traffic.
# When LetsHunt is fully closed, nothing reaches the server, so the
# in-process weather check loop never fires. You must point an
# external keep-alive pinger at `${SERVICE_URL}/health` every ≤14
# minutes. Two free options:
#
#   • cron-job.org — free, run any URL on a schedule (1-min minimum)
#   • UptimeRobot — free up to 50 monitors, 5-min minimum interval
#
# Both take 30 seconds to configure and keep your deploy at $0/month.
#
# Render Cron Jobs are available as a paid add-on (~$1/month minimum)
# and handle this internally — copy `render.cron-example.yaml` into
# the same Render workspace if you prefer that trade-off.
#
# Render auto-detects Node.js, runs `npm install && npm start`, and
# injects the PORT environment variable on the web service.
#
# The server auto-generates VAPID keys on first run, so zero
# configuration is needed. For maximum stability across Render
# restarts (which wipe the ephemeral filesystem), generate VAPID keys
# locally with `npm run generate-vapid` and set VAPID_PUBLIC_KEY and
# VAPID_PRIVATE_KEY env vars on the web service. Once stable VAPID
# env vars are in place, the browser-side subscription no longer
# needs to rotate on every server restart.

services:
  - type: web
    name: letshunt-push
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node push-server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
