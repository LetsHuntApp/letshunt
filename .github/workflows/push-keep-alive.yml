# Keep-Alive for LetsHunt Push Server
#
# Render's free tier puts web services to sleep after 15 minutes of inactivity.
# This workflow pings the push server's /health endpoint every 10 minutes to
# keep it awake, so background push notifications always work.
#
# After deploying the push server to Render (or any free host), add the server
# URL as a repository variable:
#   Settings → Secrets and variables → Actions → Variables
#   Name:  PUSH_SERVER_URL
#   Value: https://letshunt-push.onrender.com

name: Push Server Keep-Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_SERVER_URL != '' }}
    steps:
      - name: Ping push server health endpoint
        run: |
          echo "Pinging ${{ vars.PUSH_SERVER_URL }}/health"
          curl -sf "${{ vars.PUSH_SERVER_URL }}/health" || echo "Server not reachable — may be starting up or not yet deployed."
