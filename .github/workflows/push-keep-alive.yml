# Keep-Alive for LetsHunt Push Server
#
# Render's free tier puts web services to sleep after 15 minutes of inactivity.
# This workflow pings the push server's /health endpoint every 10 minutes to
# keep it awake, so background push notifications always work.
#
# The URL is hardcoded to the deployed server — no repository variable or
# manual configuration is required.

name: Push Server Keep-Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping push server health endpoint
        run: |
          echo "Pinging https://letshunt-push.onrender.com/health"
          curl -sf -H "x-keep-alive: 1" "https://letshunt-push.onrender.com/health" || echo "Server not reachable — may be starting up or not yet deployed."
