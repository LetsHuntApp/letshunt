name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push to main
# (and on manual dispatch). The Vite base path is set to this repo's Pages
# site root (/letshunt/) — the original repo uses /LetsHunt/ and is deployed
# separately, so this workflow only ever targets the LetsHuntApp/letshunt
# Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Give the workflow permission to publish the Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancel a superseded run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: VITE_BASE=/letshunt/ npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
