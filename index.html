<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LetsHunt - Real-Time Deer Hunting Forecast Engine</title>
    <meta name="description" content="5-Day deer hunting forecast prediction based on barometric pressure trends, cold fronts, wind vectors, and solunar activity." />
    
    <!-- Rustic Outdoor Display + Body Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Oswald: condensed bold sans-serif, OnX / backwoods vibe for headings -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Cinzel + Playfair Display retained for the Hunting rustic serif theme -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Optimization -->
    <!-- %BASE_URL% is replaced by Vite with the configured base path, so
         the manifest/icons resolve correctly on every GitHub Pages site
         (/LetsHunt/ on the original repo, /letshunt/ on the second). -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/png" sizes="120x120" href="%BASE_URL%hunt-icon-120.png" />
    <link rel="shortcut icon" type="image/png" href="%BASE_URL%hunt-icon-120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-v8.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LetsHunt" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
